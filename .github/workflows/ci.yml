name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every platform job builds, runs the test suite, then runs the benchmark on
# the same binaries and uploads its results. The last job collects every
# platform's results plus the deterministic counts and builds the website
# from them, which a push to main publishes on GitHub Pages. Nothing is
# measured twice: the website is assembled from what the platform jobs
# produced.
env:
  BENCH_REPS: 11   # per cell at 100,000 elements on the shared runners (21 on a quiet machine)

jobs:
  linux-gcc:
    name: Linux GCC ${{ matrix.gcc }} (x86-64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-${{ matrix.gcc }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: README scorecard is current
        run: python3 scripts/scorecard.py --check README.md
      - name: Benchmark
        if: matrix.gcc == 13
        env:
          BUILD_DIR: build
          BENCH_ID: linux-x86-64-gcc13
          BENCH_HOST: GitHub Actions ubuntu-24.04, shared runner
          BENCH_NO_SITE: 1
        run: sh scripts/bench.sh --reps $BENCH_REPS
      - name: Upload results
        if: matrix.gcc == 13
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-x86-64-gcc13
          path: results/linux-x86-64-gcc13.*
          if-no-files-found: error

  linux-clang:
    name: Linux Clang (x86-64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        env:
          BUILD_DIR: build
          BENCH_ID: linux-x86-64-clang
          BENCH_HOST: GitHub Actions ubuntu-24.04, shared runner
          BENCH_NO_SITE: 1
        run: sh scripts/bench.sh --reps $BENCH_REPS
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-x86-64-clang
          path: results/linux-x86-64-clang.*
          if-no-files-found: error

  linux-arm64:
    name: Linux GCC (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        env:
          BUILD_DIR: build
          BENCH_ID: linux-arm64-gcc
          BENCH_HOST: GitHub Actions ubuntu-24.04-arm, shared runner
          BENCH_NO_SITE: 1
        run: sh scripts/bench.sh --reps $BENCH_REPS
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-linux-arm64-gcc
          path: results/linux-arm64-gcc.*
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Clang (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        env:
          BUILD_DIR: build
          BENCH_ID: macos-arm64-appleclang
          BENCH_HOST: GitHub Actions macos-latest, shared runner
          BENCH_NO_SITE: 1
        run: sh scripts/bench.sh --reps $BENCH_REPS
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-macos-arm64-appleclang
          path: results/macos-arm64-appleclang.*
          if-no-files-found: error

  windows-msvc:
    name: Windows MSVC (x86-64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -A x64   # default generator is the newest installed Visual Studio
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark
        env:
          BUILD_DIR: build
          BENCH_ID: windows-x86-64-msvc
          BENCH_HOST: GitHub Actions windows-latest, shared runner
          BENCH_NO_SITE: 1
        run: .\scripts\bench.ps1 --reps $env:BENCH_REPS
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-windows-x86-64-msvc
          path: results/windows-x86-64-msvc.*
          if-no-files-found: error

  windows-mingw:
    name: Windows MinGW GCC (x86-64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        env:
          BUILD_DIR: build
          BENCH_ID: windows-x86-64-mingw
          BENCH_HOST: GitHub Actions windows-latest, MSYS2 UCRT64, shared runner
          BENCH_NO_SITE: 1
        run: sh scripts/bench.sh --reps $BENCH_REPS
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-windows-x86-64-mingw
          path: results/windows-x86-64-mingw.*
          if-no-files-found: error

  sanitizers:
    name: Clang ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer + UBSan
            sanitize: address,undefined
          - name: ThreadSanitizer
            sanitize: thread
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++
          -DBRAINSORT_SANITIZE=${{ matrix.sanitize }} -DBRAINSORT_BUILD_BENCHMARK=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: libFuzzer (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++
          -DBRAINSORT_BUILD_FUZZERS=ON -DBRAINSORT_BUILD_TESTS=OFF -DBRAINSORT_BUILD_BENCHMARK=OFF
      - name: Build
        run: cmake --build build
      - name: Fuzz for three minutes
        run: ./build/brainsort_fuzz -max_total_time=180 -max_len=8192 -print_final_stats=1

  linux-x86-32bit:
    name: Linux GCC -m32 (32-bit, scalar paths)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-multilib
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-m32
          -DBRAINSORT_BUILD_BENCHMARK=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The website: every platform's results, the deterministic counts and the
  # committed workstation results in results/, rendered into one page.
  site:
    name: Website
    needs: [linux-gcc, linux-clang, linux-arm64, macos-arm64, windows-msvc, windows-mingw]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: results
          merge-multiple: true
      - name: Build the website
        run: python3 scripts/website.py --out site/index.html
      - name: Upload the website
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          if-no-files-found: error
      - name: Upload for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Publish on GitHub Pages
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

[package]
name = "brainsort-bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The counted harness and the timing benchmark of the brainsort Rust port (not published)."

[dependencies]
brainsort = { path = "../brainsort", version = "0.5.0", features = ["__internals"] }
glidesort = "0.1"

[[bin]]
name = "brainsort-bench"
path = "src/main.rs"
